name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  KIT_VERSION: 10.0.28000.1839
  CONFIGURATION: Release
  PLATFORM: x64
  PROJECT: AppleStudioDisplayXDRSensorsFix
  NULL_NAME: AppleStudioDisplayAmbientLightOrientationHIDSensorsNull
  XDR_FIX_NAME: AppleStudioDisplayXDRAmbientLightUSBSensorFix
  XDR_NULL_NAME: AppleStudioDisplayXDRAmbientLightOrientationHIDSensorsNull
  PKG_ROOT: package
  STAGE_ROOT: stage
  NULL_PKG: stage\AppleStudioDisplayAmbientLightOrientationHIDSensorsNull
  XDR_FIX_PKG: stage\AppleStudioDisplayXDRAmbientLightUSBSensorFix
  XDR_NULL_PKG: stage\AppleStudioDisplayXDRAmbientLightOrientationHIDSensorsNull
  INSTALL_SCRIPT: InstallAppleStudioDisplaySensorsDrivers.bat
  XDR_INSTALL_SCRIPT: InstallAppleStudioDisplayXDRSensorsDrivers.bat
  CERT_SUBJECT: CN=Apple Studio Display (2026) and Apple Studio Display XDR (2026) Sensors Fix Test Certificate
  PFX_PASSWORD: testsigning

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3

      - uses: NuGet/setup-nuget@v3

      - name: Restore WDK NuGet packages
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Verify WDK props were restored
        shell: pwsh
        run: |
          $props = "packages\Microsoft.Windows.WDK.x64.$env:KIT_VERSION\build\native\Microsoft.Windows.WDK.x64.props"
          if (-not (Test-Path $props)) {
            Write-Host "Restored packages:"
            Get-ChildItem packages -Directory -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name)" }
            throw "WDK props not found: $props"
          }

      - name: Build
        shell: pwsh
        run: |
          msbuild "${env:PROJECT}.vcxproj" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:KitVersion=$env:KIT_VERSION `
            /m
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with $LASTEXITCODE" }

      - name: Locate WDK tools
        id: tools
        shell: pwsh
        run: |
          function Find-Tool($name) {
            $hit = Get-ChildItem -Path packages -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\(x64|x86)\\' } |
                   Select-Object -First 1
            if (-not $hit) { throw "$name not found under packages\" }
            return $hit.FullName
          }
          "signtool=$(Find-Tool 'signtool.exe')" >> $env:GITHUB_OUTPUT
          "inf2cat=$(Find-Tool 'Inf2Cat.exe')"  >> $env:GITHUB_OUTPUT
          "infverif=$(Find-Tool 'InfVerif.exe')" >> $env:GITHUB_OUTPUT

      - name: Assemble driver packages
        shell: pwsh
        run: |
          $out = "build\$env:PLATFORM\$env:CONFIGURATION"
          New-Item -ItemType Directory -Force -Path $env:PKG_ROOT, $env:NULL_PKG, $env:XDR_FIX_PKG, $env:XDR_NULL_PKG | Out-Null
          Copy-Item "${env:NULL_NAME}.inf" -Destination $env:NULL_PKG
          Copy-Item "$out\${env:XDR_FIX_NAME}.sys" -Destination $env:XDR_FIX_PKG
          Copy-Item "$out\${env:XDR_FIX_NAME}.pdb" -Destination $env:XDR_FIX_PKG
          Copy-Item "${env:XDR_FIX_NAME}.inf" -Destination $env:XDR_FIX_PKG
          Copy-Item "${env:XDR_NULL_NAME}.inf" -Destination $env:XDR_NULL_PKG

      - name: Verify INFs
        shell: pwsh
        run: |
          foreach ($inf in Get-ChildItem "$env:STAGE_ROOT\*\*.inf") {
            & "${{ steps.tools.outputs.infverif }}" /v /w $inf.FullName
            if ($LASTEXITCODE -ne 0) { throw "InfVerif failed on $($inf.Name) with $LASTEXITCODE" }
          }

      - name: Create self-signed test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $env:CERT_SUBJECT `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(5) `
            -HashAlgorithm SHA256
          $pwd = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath testcert.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:PKG_ROOT\testcert.cer" -Type CERT | Out-Null

      - name: Sign driver binary
        shell: pwsh
        run: |
          & "${{ steps.tools.outputs.signtool }}" sign /fd SHA256 /f testcert.pfx /p $env:PFX_PASSWORD `
            "$env:XDR_FIX_PKG\${env:XDR_FIX_NAME}.sys"
          if ($LASTEXITCODE -ne 0) { throw "signtool (sys) failed with $LASTEXITCODE" }

      - name: Generate catalogs
        shell: pwsh
        run: |
          foreach ($pkg in Get-ChildItem $env:STAGE_ROOT -Directory) {
            & "${{ steps.tools.outputs.inf2cat }}" "/driver:$($pkg.FullName)" /os:10_X64 /uselocaltime
            if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed on $($pkg.Name) with $LASTEXITCODE" }
            if (-not (Get-ChildItem "$($pkg.FullName)\*.cat")) { throw "Inf2Cat produced no catalog in $($pkg.Name)" }
          }

      - name: Sign catalogs
        shell: pwsh
        run: |
          foreach ($cat in Get-ChildItem "$env:STAGE_ROOT\*\*.cat") {
            & "${{ steps.tools.outputs.signtool }}" sign /fd SHA256 /f testcert.pfx /p $env:PFX_PASSWORD $cat.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool ($($cat.Name)) failed with $LASTEXITCODE" }
          }

      - name: Verify signatures
        shell: pwsh
        run: |
          Get-ChildItem "$env:STAGE_ROOT\*\*.sys", "$env:STAGE_ROOT\*\*.cat" | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0,-62} {1}" -f $_.Name, $sig.Status
            if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'UnknownError') {
              throw "$($_.Name): unexpected signature status $($sig.Status)"
            }
          }

      - name: Lay out artifact
        shell: pwsh
        run: |
          Copy-Item "$env:STAGE_ROOT\*\*" -Destination $env:PKG_ROOT -Force
          Copy-Item $env:INSTALL_SCRIPT, $env:XDR_INSTALL_SCRIPT -Destination $env:PKG_ROOT -Force
          Get-ChildItem $env:PKG_ROOT | Select-Object -ExpandProperty Name

      - name: Remove test certificate
        if: always()
        shell: pwsh
        run: Remove-Item testcert.pfx -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT }}-${{ env.PLATFORM }}-${{ env.CONFIGURATION }}
          path: package/
